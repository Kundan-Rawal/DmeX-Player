<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="/mobile-launch.js"></script>
    <style>
      .mobile-launch { display: none; }
      html[data-mobile-launch], html[data-mobile-launch] body { margin: 0; background: #000; }
      html[data-mobile-launch=light], html[data-mobile-launch=light] body { background: #fff; }
      html[data-mobile-launch] .mobile-launch { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      .mobile-launch img { width: 72px; height: 72px; object-fit: contain; }
    </style>
    <link rel="icon" type="image/png" sizes="32x32" href="/branding/favicon-32.png" />
    <link rel="apple-touch-icon" href="/branding/apple-touch-icon.png" />
    <title>DmeX Player</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' data: http: https: ws: wss: ws://* http://*; style-src 'self' 'unsafe-inline'; img-src 'self' asset: blob: data: https: http://asset.localhost https://asset.localhost; media-src 'self' asset: blob: data:;">
    <meta name="color-scheme" content="dark light">  </head>

  <body>
    <div id="root"><div class="mobile-launch" role="status" aria-label="Starting DmeX Player"><img src="/branding/dmex-orbit-d.png" alt="" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
